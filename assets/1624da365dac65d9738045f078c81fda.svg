<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="621.87384" height="220.96263" viewBox="0,0,621.87384,220.96263"><g transform="translate(-95.71886,-34.41367)"><g stroke-miterlimit="10"><path d="M696.07186,38.6942c0,-0.63227 0.09065,-2.14386 1.04046,-3.10818c1.32436,-1.12186 2.05781,-1.17235 2.71732,-1.17235c4.27053,0 13.09631,0 13.30708,0c0.60617,0 2.0178,0.0184 3.1543,1.17575c1.35814,1.23032 1.30135,2.48342 1.30135,3.03268c0,2.36248 0,7.44984 0,11.60346c0,0.66018 -0.46195,1.91784 -1.38605,2.76214c-0.8656,0.84001 -2.33857,1.30589 -3.0696,1.30589c-4.68137,0 -10.14411,0 -12.69923,0c-0.57823,0 -2.07411,-0.35553 -3.0697,-1.26987c-0.98341,-0.80308 -1.29594,-2.19689 -1.29594,-2.87026c0,0 0,-9.09251 0,-11.45925z" fill-opacity="0.01569" fill="#ededed" stroke="#000000" stroke-width="0"/><text transform="translate(112.0956,66.3634) scale(0.5,0.5)" font-size="40" xml:space="preserve" fill="#313131" stroke="none" stroke-width="1" font-family="&quot;MiSans-Heavy&quot;, Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">zxLeaf OS用户协议</tspan></text><text transform="translate(95.84209,82.01925) scale(0.24645,0.24645)" font-size="40" xml:space="preserve" fill="#5b5b5d" stroke="none" stroke-width="1" font-family="&quot;MiSans-Heavy&quot;, Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">一、协议接受本最终用户许可协议（以下简称"本协议"）是您（"用户"）与 zxLeafOS（"个人本软件"）之间关于使用 zxLeaf OS 软件</tspan><tspan x="0" dy="46.150000000000006px">（以下简称"本软件"）的法律协议。通过下载、安装、复制或使用本软件，即表示您已阅读、理解并同意接受本协议全部条款的约束。</tspan><tspan x="0" dy="46.150000000000006px">如您不同意本协议的任何条款，请立即停止使用并删除本软件.</tspan><tspan x="0" dy="46.150000000000006px">二、本软件不开源，全部内容（包括但不限于代码、界面设计、图标、文字、音频、视频等）均受中华人民共和国著作权法及其他知识产</tspan><tspan x="0" dy="46.150000000000006px">权法律保护，版权归 zx340wo 所有。本软件权利仅授予使用许可，不出售。您仅获得有限的、非独占的、不可转让的、可撤销的使用许可。</tspan><tspan x="0" dy="46.150000000000006px">您不得删除、修改或遮盖本软件中的任何版权声明、商标或标识。除本协议明确授予的权利外，您不得对本软件进行反向工程、反编译、</tspan><tspan x="0" dy="46.150000000000006px">反汇编或以其他方式尝试获取源代码。</tspan><tspan x="0" dy="46.150000000000006px">三、禁止行为未经zxLeafOS 明确书面授权，您不得进行以下行为：复制、修改、改编、翻译本软件分发、传播、出售、出租、转让本软件</tspan><tspan x="0" dy="46.150000000000006px">反向工程、反编译、反汇编或试图获取源代码对本软件进行二次开发或衍生创作将本软件用于任何商业目的或破坏本软件</tspan><tspan x="0" dy="46.150000000000006px">的任何技术保护措施。</tspan><tspan x="0" dy="46.150000000000006px">四、为提供天气信息和聊天功能，本软件会收集您的粗略地理位置及聊天内容。该数据仅用于功能实现，不会出售或共享给任何第三方。</tspan><tspan x="0" dy="46.150000000000006px">您理解并同意，使用本软件即表示您同意上述数据收集行为。</tspan><tspan x="0" dy="46.150000000000006px">五、协议修改本软件保留随时修改本协议的权利。修改后的协议将通过适当方式公布（包括但不限于软件内公告、官方网站等）。</tspan><tspan x="0" dy="46.150000000000006px">您继续使用本软件即视为接受修改后的协议。如您不同意修改后的条款，应停止使用本软件。继续使用即视为接受修改后的协议。</tspan><tspan x="0" dy="46.150000000000006px">七、法律适用与争议解决</tspan><tspan x="0" dy="46.150000000000006px">本协议适用中华人民共和国法律。因本协议引起的争议，双方应友好协商解决；协商不成的，提交本软件所在地有管辖权的人民法院诉讼解决。</tspan></text></g></g></svg>